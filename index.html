<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albert 12 Week Program">
<meta name="theme-color" content="#0a0a0f">
<title>Albert 12 Week Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --surface3: #252533;
  --border: #2a2a38;
  --accent: #e8ff47;
  --accent2: #47a8ff;
  --accent3: #ff6b47;
  --text: #f0f0f8;
  --text2: #8888a0;
  --text3: #55556a;
  --green: #47ffa0;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* HEADER */
.hdr{padding:env(safe-area-inset-top,44px) 20px 0;background:var(--bg);flex-shrink:0;z-index:10}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent)}
.hdr-sub{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:.05em}
.race-countdown{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.countdown-num{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);line-height:1}
.countdown-lbl{font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.countdown-blk{text-align:center}
.countdown-sep{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--border);margin-top:-4px}
.progress-bar{height:3px;background:var(--surface2);border-radius:99px;margin-bottom:12px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .5s ease}

/* NAV TABS */
.nav{display:flex;gap:6px;padding:0 20px 10px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;letter-spacing:.04em}
.nav-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500}

/* SCROLL CONTENT */
.content{flex:1;overflow-y:auto;padding:0 20px;padding-bottom:calc(80px + var(--safe));scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.section{display:none}
.section.active{display:block}

/* TODAY SECTION */
.today-date{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px}
.session-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.session-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-strength{background:var(--accent2)}
.dot-run{background:var(--green)}
.dot-combo{background:var(--accent)}
.dot-rest{background:var(--text3)}
.session-name{font-weight:500;font-size:14px;flex:1}
.session-type{font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.type-strength{background:rgba(71,168,255,.15);color:var(--accent2)}
.type-run{background:rgba(71,255,160,.15);color:var(--green)}
.type-combo{background:rgba(232,255,71,.15);color:var(--accent)}
.type-rest{background:rgba(85,85,106,.2);color:var(--text3)}
.chev{font-size:18px;color:var(--text3);transition:transform .2s}
.session-body{display:none;border-top:1px solid var(--border)}
.session-body.open{display:block}
.ex-section-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px 6px}
.ex-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid rgba(42,42,56,.6)}
.ex-row:first-of-type{border-top:none}
.ex-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ex-check.done{background:var(--green);border-color:var(--green)}
.ex-check.done::after{content:'✓';font-size:12px;color:#000;font-weight:700}
.ex-info{flex:1}
.ex-name{font-size:13px;font-weight:500}
.ex-detail{font-size:11px;color:var(--text2);margin-top:1px;font-family:'DM Mono',monospace}
.ex-note-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;resize:none;margin-top:4px;outline:none}
.ex-note-input:focus{border-color:var(--accent2)}
.session-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.session-note-area{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;resize:none;outline:none;min-height:50px}
.session-note-area:focus{border-color:var(--accent2)}
.btn-complete{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;transition:all .15s;font-weight:500}
.btn-complete.done{background:var(--green);color:#000}
.btn-complete.pending{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.session-completed-banner{padding:10px 16px;background:rgba(71,255,160,.08);border-top:1px solid rgba(71,255,160,.2);font-size:12px;color:var(--green);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:6px}

/* WEEK VIEW */
.week-grid{display:grid;gap:8px;margin-bottom:16px}
.week-day-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.week-day-row.completed{border-color:rgba(71,255,160,.3);background:rgba(71,255,160,.04)}
.week-day-row.today-row{border-color:var(--accent);background:rgba(232,255,71,.04)}
.wdr-day{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);min-width:26px;letter-spacing:.04em}
.wdr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wdr-name{font-size:13px;font-weight:500;flex:1}
.wdr-status{font-size:10px;font-family:'DM Mono',monospace}
.status-done{color:var(--green)}
.status-today{color:var(--accent)}
.status-upcoming{color:var(--text3)}

/* HISTORY */
.hist-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.hist-date{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);margin-bottom:4px}
.hist-name{font-size:13px;font-weight:500;margin-bottom:6px}
.hist-stats{display:flex;gap:10px;flex-wrap:wrap}
.hist-stat{font-size:10px;font-family:'DM Mono',monospace;background:var(--surface2);padding:3px 8px;border-radius:6px;color:var(--text2)}
.hist-note{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5;font-style:italic}

/* PROGRAM */
.phase-hdr{margin-bottom:10px;padding:12px 14px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.phase-title-txt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.phase-sub{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);margin-top:2px}
.prog-day{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.prog-day-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.prog-day-body{display:none;border-top:1px solid var(--border)}
.prog-day-body.open{display:block}
.prog-ex-row{padding:8px 14px;border-top:1px solid rgba(42,42,56,.5);display:flex;gap:8px;align-items:flex-start}
.prog-ex-row:first-child{border-top:none}
.prog-bullet{width:5px;height:5px;border-radius:50%;background:var(--accent2);flex-shrink:0;margin-top:6px}
.prog-bullet.run{background:var(--green)}
.prog-bullet.core{background:var(--accent)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--accent)}
.stat-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.stat-sub{font-size:11px;color:var(--text2);margin-top:2px}
.streak-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.streak-dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)}
.streak-dot.done{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
.streak-dot.today{border-color:var(--accent);color:var(--accent)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 0;padding-bottom:calc(10px + var(--safe));z-index:20;display:flex;justify-content:space-around}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:color .15s}
.bnav-btn.active{color:var(--accent)}
.bnav-icon{font-size:22px;line-height:1}
.bnav-lbl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px;padding-bottom:calc(20px + var(--safe));max-height:80vh;overflow-y:auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;margin-bottom:16px}
.modal-close{float:right;background:var(--surface2);border:none;color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--accent2)}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#000;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:opacity .15s}
.btn-primary:active{opacity:.8}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px;font-family:'DM Mono',monospace}

/* PHASE SELECTOR */
.phase-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.phase-sel::-webkit-scrollbar{display:none}
.phase-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.phase-pill.active{background:var(--accent2);color:#000;border-color:var(--accent2);font-weight:500}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;margin-bottom:12px;padding-top:4px}
.divider{height:1px;background:var(--border);margin:16px 0}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace;letter-spacing:.03em}
.badge-str{background:rgba(71,168,255,.15);color:var(--accent2)}
.badge-run{background:rgba(71,255,160,.15);color:var(--green)}
.badge-core{background:rgba(232,255,71,.15);color:var(--accent)}
.badge-mob{background:rgba(255,107,71,.15);color:var(--accent3)}

.note-note{font-size:12px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:8px 10px;line-height:1.55;margin:10px 16px 12px;border-left:2px solid var(--accent2)}

/* EXERCISE DEMO */
.ex-info-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--accent2);font-size:13px;font-family:'DM Mono',monospace;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ex-info-btn:active{background:var(--accent2);color:#000}
.demo-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.demo-modal-overlay.open{display:flex}
.demo-modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px calc(20px + var(--safe));max-height:88vh;overflow-y:auto}
.demo-modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.demo-modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.5px;color:var(--text);flex:1;padding-right:12px;line-height:1.1}
.demo-modal-close{background:var(--surface2);border:none;color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.demo-detail-lbl{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent2);letter-spacing:.06em;margin-bottom:16px}
.demo-anim-wrap{background:var(--surface2);border-radius:16px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:200px}
.demo-anim-wrap svg{width:100%;max-width:340px;height:auto}
.demo-cues{list-style:none;margin:0;padding:0}
.demo-cue{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.4}
.demo-cue:first-child{border-top:none}
.demo-cue-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1;flex-shrink:0;width:18px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <div>
      <div class="hdr-title">ALBERT 12 WEEK PROGRAM</div>
      <div class="hdr-sub">30 AUG 2026 — RACE DAY</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text2)">PROGRESS</div>
      <div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--accent)" id="hdr-progress">0 / 84 sessions</div>
    </div>
  </div>
  <div class="race-countdown" id="countdown-bar">
    <div class="countdown-blk"><div class="countdown-num" id="cd-days">-</div><div class="countdown-lbl">days</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-blk"><div class="countdown-num" id="cd-weeks">-</div><div class="countdown-lbl">weeks</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-blk"><div class="countdown-num" id="cd-sessions">-</div><div class="countdown-lbl">sessions left</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="showSection('today',this)">Today</button>
    <button class="nav-btn" onclick="showSection('week',this)">This week</button>
    <button class="nav-btn" onclick="showSection('program',this)">Program</button>
    <button class="nav-btn" onclick="showSection('history',this)">History</button>
    <button class="nav-btn" onclick="showSection('stats',this)">Stats</button>
  </div>
</div>

<div class="content">

<!-- TODAY -->
<div class="section active" id="section-today">
  <div class="today-date" id="today-date-lbl"></div>
  <div id="today-sessions"></div>
</div>

<!-- WEEK -->
<div class="section" id="section-week">
  <div class="section-title">THIS WEEK</div>
  <div id="week-view"></div>
</div>

<!-- PROGRAM -->
<div class="section" id="section-program">
  <div class="section-title">12-WEEK PROGRAM</div>
  <div class="phase-sel" id="phase-sel"></div>
  <div id="program-view"></div>
</div>

<!-- HISTORY -->
<div class="section" id="section-history">
  <div class="section-title">TRAINING LOG</div>
  <div id="history-view"></div>
</div>

<!-- STATS -->
<div class="section" id="section-stats">
  <div class="section-title">YOUR STATS</div>
  <div id="stats-view"></div>
</div>

</div>

<!-- EXERCISE DEMO MODAL -->
<div class="demo-modal-overlay" id="demo-overlay" onclick="closeDemoModal(event)">
  <div class="demo-modal" id="demo-modal">
    <div class="demo-modal-top">
      <div class="demo-modal-title" id="demo-title"></div>
      <button class="demo-modal-close" onclick="closeDemoModal()">✕</button>
    </div>
    <div class="demo-detail-lbl" id="demo-detail"></div>
    <div class="demo-anim-wrap" id="demo-anim"></div>
    <ul class="demo-cues" id="demo-cues"></ul>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="bnav-btn active" onclick="showSection('today',null,'today-btn')" id="bn-today">
    <div class="bnav-icon">⚡</div><div class="bnav-lbl">Today</div>
  </button>
  <button class="bnav-btn" onclick="showSection('week',null,'week-btn')" id="bn-week">
    <div class="bnav-icon">📅</div><div class="bnav-lbl">Week</div>
  </button>
  <button class="bnav-btn" onclick="showSection('program',null,'prog-btn')" id="bn-program">
    <div class="bnav-icon">📋</div><div class="bnav-lbl">Program</div>
  </button>
  <button class="bnav-btn" onclick="showSection('history',null,'hist-btn')" id="bn-history">
    <div class="bnav-icon">📊</div><div class="bnav-lbl">Log</div>
  </button>
  <button class="bnav-btn" onclick="showSection('stats',null,'stats-btn')" id="bn-stats">
    <div class="bnav-icon">🏃</div><div class="bnav-lbl">Stats</div>
  </button>
</div>

<script>
// ─────────────────────────────────────────
// DATA — 12-WEEK PROGRAM
// ─────────────────────────────────────────
const RACE_DATE = new Date('2026-08-30');
const PLAN_START = new Date('2026-06-09');

const PROGRAM = [
  // PHASE 1 — Foundation (Weeks 1-3)
  {phase:1,week:1,day:'Mon',name:'Lower body A + core',type:'strength',exercises:[
    {id:'p1w1mon1',name:'Back squat',detail:'4 × 8 @ 65–70% 1RM · 3-sec descent',cat:'strength'},
    {id:'p1w1mon2',name:'Romanian deadlift',detail:'3 × 10 · hip hinge focus',cat:'strength'},
    {id:'p1w1mon3',name:'Walking lunges',detail:'3 × 12/leg · bodyweight or light DBs',cat:'strength'},
    {id:'p1w1mon4',name:'Single-leg calf raise (box)',detail:'3 × 15/leg · full range',cat:'strength'},
    {id:'p1w1mon5',name:'Banded hip abduction',detail:'3 × 15 · glute activation',cat:'strength'},
    {id:'p1w1mon6',name:'KB swings',detail:'3 × 15 · core braces at top',cat:'core'},
    {id:'p1w1mon7',name:'Dead bug',detail:'3 × 8/side · press back into floor',cat:'core'},
    {id:'p1w1mon8',name:'Plank',detail:'3 × 40 sec · squeeze glutes',cat:'core'},
  ],note:'10 min hip flexor + hamstring mobility after'},
  {phase:1,week:1,day:'Tue',name:'Easy run + upper pull',type:'combo',exercises:[
    {id:'p1w1tue1',name:'Easy run',detail:'6–8km @ conversational pace · zone 2',cat:'run'},
    {id:'p1w1tue2',name:'Ring rows',detail:'3 × 10 · horizontal pull',cat:'strength'},
    {id:'p1w1tue3',name:'Ring push-ups',detail:'3 × 10',cat:'strength'},
    {id:'p1w1tue4',name:'Dead hang',detail:'3 × 30 sec · shoulder decompression',cat:'strength'},
    {id:'p1w1tue5',name:'KB windmill',detail:'2 × 6/side · obliques + hip mobility',cat:'core'},
    {id:'p1w1tue6',name:'Side plank',detail:'2 × 30 sec/side',cat:'core'},

// STATE
// ─────────────────────────────────────────
function loadState(){try{return JSON.parse(localStorage.getItem('mt_state')||'{}')}catch(e){return{}}}
function saveState(s){localStorage.setItem('mt_state',JSON.stringify(s))}
let STATE = loadState();
if(!STATE.completedExercises) STATE.completedExercises={};
if(!STATE.completedSessions) STATE.completedSessions={};
if(!STATE.sessionNotes) STATE.sessionNotes={};
if(!STATE.exerciseNotes) STATE.exerciseNotes={};

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function formatDate(d){const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()}
function sessionKey(s){return `p${s.phase}_w${s.week}_${s.day}`}
function getSessionsForDate(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const start=new Date(PLAN_START);start.setHours(0,0,0,0);
  const diffDays=Math.round((d-start)/(1000*60*60*24));
  if(diffDays<0||diffDays>=84) return [];
  const week=Math.floor(diffDays/7)+1;
  if(week<1||week>12) return [];
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayOfWeek=dayNames[(d.getDay()+6)%7];
  return PROGRAM.filter(s=>s.week===week&&s.day===dayOfWeek);
}
function getWeekSessions(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const dow=(d.getDay()+6)%7;
  const monday=new Date(d);monday.setDate(d.getDate()-dow);
  const sessions=[];
  for(let i=0;i<7;i++){
    const day=new Date(monday);day.setDate(monday.getDate()+i);
    const ss=getSessionsForDate(day);
    sessions.push({date:day,sessions:ss});
  }
  return sessions;
}
function totalCompleted(){return Object.keys(STATE.completedSessions).filter(k=>STATE.completedSessions[k]).length}
function dotClass(type){return type==='strength'?'dot-strength':type==='run'?'dot-run':type==='combo'?'dot-combo':'dot-rest'}
function typeClass(type){return type==='strength'?'type-strength':type==='run'?'type-run':type==='combo'?'type-combo':'type-rest'}
function typeLabel(type){return type==='strength'?'Strength':type==='run'?'Run':type==='combo'?'Run+Lift':'Rest'}

// ─────────────────────────────────────────
// COUNTDOWN
// ─────────────────────────────────────────
function updateCountdown(){
  const now=new Date();
  const diff=RACE_DATE-now;
  if(diff<=0){document.getElementById('cd-days').textContent='0';document.getElementById('cd-weeks').textContent='0';document.getElementById('cd-sessions').textContent='0';return;}
  const days=Math.ceil(diff/(1000*60*60*24));
  const weeks=Math.ceil(days/7);
  const done=totalCompleted();
  const remaining=Math.max(0,84-done);
  document.getElementById('cd-days').textContent=days;
  document.getElementById('cd-weeks').textContent=weeks;
  document.getElementById('cd-sessions').textContent=remaining;
  const pct=Math.round((done/84)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('hdr-progress').textContent=done+' / 84 sessions';
}

// ─────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────
let currentSection='today';
function showSection(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const bnMap={today:'bn-today',week:'bn-week',program:'bn-program',history:'bn-history',stats:'bn-stats'};
  const bnId=bnMap[id];if(bnId){const b=document.getElementById(bnId);if(b)b.classList.add('active');}
  const navBtns=document.querySelectorAll('.nav-btn');
  const order=['today','week','program','history','stats'];
  const idx=order.indexOf(id);
  if(idx>=0&&navBtns[idx]) navBtns[idx].classList.add('active');
  currentSection=id;
  if(id==='today') renderToday();
  else if(id==='week') renderWeek();
  else if(id==='history') renderHistory();
  else if(id==='stats') renderStats();
}

// RENDER TODAY
// ─────────────────────────────────────────
function renderToday(){
  const today=new Date();
  document.getElementById('today-date-lbl').textContent=formatDate(today).toUpperCase();
  const sessions=getSessionsForDate(today);
  const container=document.getElementById('today-sessions');
  if(sessions.length===0){
    container.innerHTML=`<div class="empty"><div class="empty-icon">📅</div><div class="empty-txt">No sessions scheduled today.<br><br>Plan starts ${formatDate(PLAN_START)}</div></div>`;
    return;
  }
  container.innerHTML=sessions.map(s=>renderSessionCard(s,true)).join('');
}

function renderSessionCard(s,interactive){
  const key=sessionKey(s);
  const done=STATE.completedSessions[key];
  const totalEx=s.exercises.length;
  const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
  return `<div class="session-card" id="card-${key}">
    <div class="session-hdr" onclick="toggleSession('${key}')">
      <div class="session-dot ${dotClass(s.type)}"></div>
      <div class="session-name">${s.name}</div>
      <span class="session-type ${typeClass(s.type)}">${typeLabel(s.type)}</span>
      <div class="chev" id="chev-${key}">›</div>
    </div>
    ${done?`<div class="session-completed-banner">✓ COMPLETED · ${doneEx}/${totalEx} exercises logged</div>`:''}
    <div class="session-body" id="body-${key}">
      ${renderExercises(s,interactive)}
      ${s.note?`<div class="note-note">${s.note}</div>`:''}
      <div class="session-footer">
        <textarea class="session-note-area" placeholder="Session notes…" id="snote-${key}" oninput="saveSessionNote('${key}',this.value)">${STATE.sessionNotes[key]||''}</textarea>
        <button class="btn-complete ${done?'done':'pending'}" id="cbtn-${key}" onclick="toggleSessionComplete('${key}')">${done?'DONE ✓':'MARK DONE'}</button>
      </div>
    </div>
  </div>`;
}

function renderExercises(s,interactive){
  let html='';
  let lastCat='';
  s.exercises.forEach(e=>{
    const cat=e.cat==='core'?'core':e.cat==='run'?'run':'lift';
    if(cat!==lastCat){
      const lbl=e.cat==='core'?'Core finisher':e.cat==='run'?'Running':e.cat==='rest'?'Recovery':'Strength';
      html+=`<div class="ex-section-lbl">${lbl}</div>`;
      lastCat=cat;
    }
    const done=STATE.completedExercises[e.id];
    const dotCol=e.cat==='run'?'run':e.cat==='core'?'core':'';
    html+=`<div class="ex-row">
      <div class="ex-check ${done?'done':''}" onclick="toggleExercise('${e.id}','${sessionKey(s)}')"></div>
      <div class="ex-info">
        <div class="ex-name" style="${done?'text-decoration:line-through;opacity:.5':''}">${e.name}</div>
        <div class="ex-detail">${e.detail}</div>
        <input class="ex-note-input" type="text" placeholder="Weight / reps / notes…" value="${STATE.exerciseNotes[e.id]||''}" oninput="saveExNote('${e.id}',this.value)">
      </div>
      <button class="ex-info-btn" onclick="showExDemo('${e.name.replace(/'/g,"\\'")}','${e.detail.replace(/'/g,"\\'")}')">ⓘ</button>
    </div>`;
  });
  return html;
}

function toggleSession(key){
  const body=document.getElementById('body-'+key);
  const chev=document.getElementById('chev-'+key);
  if(!body) return;
  const open=body.classList.toggle('open');
  if(chev) chev.style.transform=open?'rotate(90deg)':'';
}
function toggleExercise(exId,sessKey){
  STATE.completedExercises[exId]=!STATE.completedExercises[exId];
  saveState(STATE);
  updateCountdown();
  // Surgical DOM update — no full re-render so the page never jumps
  const done=STATE.completedExercises[exId];
  const chk=document.querySelector(`.ex-check[onclick*="'${exId}'"]`);
  if(chk){
    chk.classList.toggle('done',done);
    const nameEl=chk.nextElementSibling&&chk.nextElementSibling.querySelector('.ex-name');
    if(nameEl) nameEl.style.cssText=done?'text-decoration:line-through;opacity:.5':'';
  }
  // Update the session completed-banner exercise count
  const s=PROGRAM.find(x=>sessionKey(x)===sessKey);
  if(s){
    const card=document.getElementById('card-'+sessKey);
    if(card){
      const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
      const banner=card.querySelector('.session-completed-banner');
      if(banner) banner.textContent=`✓ COMPLETED · ${doneEx}/${s.exercises.length} exercises logged`;
    }
  }
}
function toggleSessionComplete(key){
  STATE.completedSessions[key]=!STATE.completedSessions[key];
  if(STATE.completedSessions[key]){
    // Find session and mark all exercises done
    const s=PROGRAM.find(x=>sessionKey(x)===key);
    if(s) s.exercises.forEach(e=>{STATE.completedExercises[e.id]=true;});
  }
  saveState(STATE);
  updateCountdown();
  if(currentSection==='today') renderToday();
  else renderHistory();
}
function saveSessionNote(key,val){STATE.sessionNotes[key]=val;saveState(STATE);}
function saveExNote(exId,val){STATE.exerciseNotes[exId]=val;saveState(STATE);}

function renderWeek(){
  const today=new Date();
  const weekSessions=getWeekSessions(today);
  const container=document.getElementById('week-view');
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html='';
  weekSessions.forEach((wd,i)=>{
    const isToday=wd.date.toDateString()===today.toDateString();
    const isPast=wd.date<today&&!isToday;
    const dayLabel=dayNames[i];
    const dateNum=wd.date.getDate();
    if(wd.sessions.length===0){
      html+=`<div class="week-day-row ${isToday?'today-row':''}">
        <span class="wdr-day">${dayLabel} ${dateNum}</span>
        <span class="wdr-dot" style="background:var(--text3)"></span>
        <span class="wdr-name" style="color:var(--text3)">Rest</span>
        <span class="wdr-status status-upcoming">—</span>
      </div>`;
      return;
    }
    wd.sessions.forEach(s=>{
      const key=sessionKey(s);
      const done=STATE.completedSessions[key];
      html+=`<div class="week-day-row ${done?'completed':''} ${isToday?'today-row':''}" onclick="openDaySession('${key}')">
        <span class="wdr-day">${dayLabel} ${dateNum}</span>
        <span class="wdr-dot ${dotClass(s.type)}"></span>
        <span class="wdr-name">${s.name}</span>
        <span class="wdr-status ${done?'status-done':isToday?'status-today':'status-upcoming'}">${done?'✓ done':isToday?'today':'—'}</span>
      </div>`;
    });
  });
  container.innerHTML='<div class="week-grid">'+html+'</div>';
}
function openDaySession(key){
  const s=PROGRAM.find(x=>sessionKey(x)===key);
  if(!s) return;
  showSection('today',null);
  document.getElementById('today-date-lbl').textContent='WEEK '+s.week+' — '+s.day.toUpperCase();
  const container=document.getElementById('today-sessions');
  container.innerHTML=renderSessionCard(s,true);
  setTimeout(()=>toggleSession(key),100);
}

  // Render phase selector
  const selEl=document.getElementById('phase-sel');
  selEl.innerHTML=phases.map(p=>`<button class="phase-pill ${p.n===phase?'active':''}" onclick="renderProgram(${p.n})">${p.label.split(' — ')[0]+' — '+p.label.split(' — ')[1]}</button>`).join('');
  const ph=phases.find(p=>p.n===phase);
  const sessions=PROGRAM.filter(s=>s.phase===phase);
  let html=`<div class="phase-hdr"><div class="phase-title-txt">${ph.label}</div><div class="phase-sub">${ph.sub}</div></div>`;
  let lastWeek=0;
  sessions.forEach(s=>{
    if(s.week!==lastWeek){html+=`<div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px">WEEK ${s.week}</div>`;lastWeek=s.week;}
    const key=sessionKey(s);
    const done=STATE.completedSessions[key];
    const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
    html+=`<div class="prog-day">
      <div class="prog-day-hdr" onclick="toggleProgDay('prog-${key}')">
        <div class="session-dot ${dotClass(s.type)}" style="width:8px;height:8px"></div>
        <div style="font-size:12px;font-family:'DM Mono',monospace;color:var(--text3);min-width:26px">${s.day}</div>
        <div style="font-size:13px;font-weight:500;flex:1">${s.name}</div>
        ${done?`<span style="font-size:10px;font-family:'DM Mono',monospace;color:var(--green)">✓</span>`:''}
        <div class="chev" id="chev-prog-${key}" style="font-size:16px;color:var(--text3);transition:transform .2s">›</div>
      </div>
      <div class="prog-day-body" id="prog-${key}">
        ${s.exercises.map(e=>`<div class="prog-ex-row">
          <div class="prog-bullet ${e.cat==='run'?'run':e.cat==='core'?'core':''}"></div>
          <div><div style="font-size:12px;font-weight:500">${e.name}</div><div style="font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:1px">${e.detail}</div></div>
        </div>`).join('')}
        ${s.note?`<div class="note-note" style="margin:10px 14px 12px">${s.note}</div>`:''}
        <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
          <button onclick="openDaySession('${key}')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer">Log this session ↗</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('program-view').innerHTML=html;
}
function toggleProgDay(id){
  const body=document.getElementById(id);
  const chev=document.getElementById('chev-'+id);
  if(!body) return;
  const open=body.classList.toggle('open');
  if(chev) chev.style.transform=open?'rotate(90deg)':'';
}

// ─────────────────────────────────────────
// RENDER HISTORY
// ─────────────────────────────────────────
function renderHistory(){
  const completed=PROGRAM.filter(s=>STATE.completedSessions[sessionKey(s)]);
  const container=document.getElementById('history-view');
  if(completed.length===0){
    container.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">No sessions logged yet.<br><br>Complete your first session to see it here.</div></div>`;
    return;
  }
  // Sort by week + day order
  const dayOrder=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sorted=[...completed].sort((a,b)=>{
    if(a.week!==b.week) return b.week-a.week;
    return dayOrder.indexOf(b.day)-dayOrder.indexOf(a.day);
  });
  const html=sorted.map(s=>{
    const key=sessionKey(s);
    const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
    const totalEx=s.exercises.length;
    const note=STATE.sessionNotes[key];
    const exNotes=s.exercises.filter(e=>STATE.exerciseNotes[e.id]);
    return `<div class="hist-entry">
      <div class="hist-date">PHASE ${s.phase} · WEEK ${s.week} · ${s.day.toUpperCase()}</div>
      <div class="hist-name">${s.name}</div>
      <div class="hist-stats">
        <span class="hist-stat">${typeLabel(s.type)}</span>
        <span class="hist-stat">${doneEx}/${totalEx} exercises</span>
        ${note?'<span class="hist-stat">note logged</span>':''}
      </div>
      ${exNotes.length>0?`<div style="margin-top:8px">${exNotes.map(e=>`<div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);margin-top:3px">• ${e.name}: ${STATE.exerciseNotes[e.id]}</div>`).join('')}</div>`:''}
      ${note?`<div class="hist-note">${note}</div>`:''}
    </div>`;
  }).join('');
  container.innerHTML=html;
}

// ─────────────────────────────────────────
// RENDER STATS
// ─────────────────────────────────────────
function renderStats(){
  const done=totalCompleted();
  const pct=Math.round((done/84)*100);
  const strengthDone=PROGRAM.filter(s=>s.type==='strength'&&STATE.completedSessions[sessionKey(s)]).length;
  const runDone=PROGRAM.filter(s=>(s.type==='run'||s.type==='combo')&&STATE.completedSessions[sessionKey(s)]).length;
  const allKeys=PROGRAM.map(s=>sessionKey(s));
  // streak
  const dayOrder=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const last14=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const ss=getSessionsForDate(d);
    const anyDone=ss.some(s=>STATE.completedSessions[sessionKey(s)]);
    const isToday=d.toDateString()===today.toDateString();
    last14.push({d,anyDone,isToday,hasSessions:ss.length>0});
  }
  const html=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">${done}</div><div class="stat-lbl">Sessions done</div><div class="stat-sub">of 84 total</div></div>
      <div class="stat-card"><div class="stat-val">${pct}%</div><div class="stat-lbl">Complete</div><div class="stat-sub">${84-done} remaining</div></div>
      <div class="stat-card"><div class="stat-val">${strengthDone}</div><div class="stat-lbl">Strength sessions</div></div>
      <div class="stat-card"><div class="stat-val">${runDone}</div><div class="stat-lbl">Run sessions</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">LAST 14 DAYS</div>
      <div class="streak-bar">${last14.map(ld=>`<div class="streak-dot ${ld.anyDone?'done':''} ${ld.isToday&&!ld.anyDone?'today':''}">${ld.d.getDate()}</div>`).join('')}</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">PHASE BREAKDOWN</div>
      ${[1,2,3,4].map(ph=>{
        const total=PROGRAM.filter(s=>s.phase===ph).length;
        const done=PROGRAM.filter(s=>s.phase===ph&&STATE.completedSessions[sessionKey(s)]).length;
        const pct2=total>0?Math.round((done/total)*100):0;
        const labels=['Foundation','Build','Peak','Taper'];
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text2)">PHASE ${ph} — ${labels[ph-1]}</span>
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)">${done}/${total}</span>
          </div>
          <div style="height:4px;background:var(--surface2);border-radius:99px;overflow:hidden">
            <div style="width:${pct2}%;height:100%;background:var(--accent);border-radius:99px"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px">
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">RACE COUNTDOWN</div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);line-height:1" id="stats-countdown"></div>
        <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text2)">days to<br>30 Aug 2026</div>
      </div>
    </div>
  `;
  document.getElementById('stats-view').innerHTML=html;
  const diff=Math.ceil((RACE_DATE-new Date())/(1000*60*60*24));
  const el=document.getElementById('stats-countdown');
  if(el) el.textContent=Math.max(0,diff);
}

function getYouTubeKey(key){
  if(YOUTUBE_LINKS[key]) return key;
  const ytKeys = Object.keys(YOUTUBE_LINKS);
  return ytKeys.find(k => key.includes(k) || k.includes(key.split(' ').slice(0,2).join(' '))) || null;
}

function normalizeExName(name){
  return name.toLowerCase()
    .replace(/\s*[-–—]\s*(deload|eccentric|slow|light|heavy|heavier|add.*|same.*|drop.*)$/i,'')
    .replace(/\s+/g,' ').trim();
}

function showExDemo(name, detail){
  const key = normalizeExName(name);
  // Try exact match first, then partial
  let demo = EXERCISE_DEMOS[key];
  if(!demo){
    const keys = Object.keys(EXERCISE_DEMOS);
    const partial = keys.find(k => key.includes(k) || k.includes(key.split(' ').slice(0,2).join(' ')));
    if(partial) demo = EXERCISE_DEMOS[partial];
  }
  const overlay = document.getElementById('demo-overlay');
  document.getElementById('demo-title').textContent = name.toUpperCase();
  document.getElementById('demo-detail').textContent = detail;
  if(demo){
    document.getElementById('demo-anim').innerHTML = demo.svg;
    document.getElementById('demo-cues').innerHTML = demo.cues.map((c,i)=>
      `<li class="demo-cue"><span class="demo-cue-num">${i+1}</span><span>${c}</span></li>`
    ).join('');
  } else {
    const ytKey = getYouTubeKey(key);
    const yt = ytKey ? YOUTUBE_LINKS[ytKey] : null;
    if(yt){
      document.getElementById('demo-anim').innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:16px;text-align:center">
          <div style="font-size:36px">▶️</div>
          <a href="${yt.url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:#ff0000;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.04em">
            <span style="font-size:16px">▶</span> WATCH ON YOUTUBE
          </a>
          <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);line-height:1.5">${yt.title}</div>
        </div>`;
      document.getElementById('demo-cues').innerHTML = yt.cues.map((c,i)=>
        `<li class="demo-cue"><span class="demo-cue-num">${i+1}</span><span>${c}</span></li>`
      ).join('');
    } else {
      document.getElementById('demo-anim').innerHTML = `<div style="padding:40px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">Animation coming soon</div>`;
      document.getElementById('demo-cues').innerHTML = `<li class="demo-cue"><span class="demo-cue-num">→</span><span>Focus on controlled movement, maintain neutral spine, and breathe steadily throughout the exercise.</span></li>`;
    }
  }
  overlay.classList.add('open');
}

function closeDemoModal(e){
  if(!e || e.target === document.getElementById('demo-overlay')){
    document.getElementById('demo-overlay').classList.remove('open');
  }
}

  updateCountdown();

  // open first today session
  const sessions=getSessionsForDate(new Date());
  if(sessions.length>0){
    setTimeout(()=>{
      const key=sessionKey(sessions[0]);
      toggleSession(key);
    },300);
  }
};
