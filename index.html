<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albert 12 Week Program">
<meta name="theme-color" content="#0a0a0f">
<title>Albert 12 Week Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --surface3: #252533;
  --border: #2a2a38;
  --accent: #c2d680;
  --accent2: #47a8ff;
  --accent3: #ff6b47;
  --text: #f0f0f8;
  --text2: #b4b8cc;
  --text3: #8b90a8;
  --green: #47ffa0;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* HEADER */
.hdr{padding:env(safe-area-inset-top,44px) 20px 0;background:var(--bg);flex-shrink:0;z-index:10}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent)}
.hdr-sub{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:.05em}
.race-countdown{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.countdown-num{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);line-height:1}
.countdown-lbl{font-size:10px;color:var(--text2);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.countdown-blk{text-align:center}
.countdown-sep{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--border);margin-top:-4px}
.progress-bar{height:3px;background:var(--surface2);border-radius:99px;margin-bottom:12px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .5s ease}

/* NAV TABS */
.nav{display:flex;gap:6px;padding:0 20px 10px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;letter-spacing:.04em}
.nav-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500}

/* SCROLL CONTENT */
.content{flex:1;overflow-y:auto;padding:0 20px;padding-bottom:calc(80px + var(--safe));scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.section{display:none}
.section.active{display:block}

/* TODAY SECTION */
.today-date{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px}
.session-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.session-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-strength{background:var(--accent2)}
.dot-run{background:var(--green)}
.dot-combo{background:var(--accent)}
.dot-rest{background:var(--text3)}
.session-name{font-weight:500;font-size:14px;flex:1}
.session-type{font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.type-strength{background:rgba(71,168,255,.15);color:var(--accent2)}
.type-run{background:rgba(71,255,160,.15);color:var(--green)}
.type-combo{background:rgba(194,214,128,.15);color:var(--accent)}
.type-rest{background:rgba(85,85,106,.2);color:var(--text3)}
.chev{font-size:18px;color:var(--text3);transition:transform .2s}
.session-body{display:none;border-top:1px solid var(--border)}
.session-body.open{display:block}
.ex-section-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px 6px}
.ex-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid rgba(42,42,56,.6)}
.ex-row:first-of-type{border-top:none}
.ex-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ex-check.done{background:var(--green);border-color:var(--green)}
.ex-check.done::after{content:'✓';font-size:12px;color:#000;font-weight:700}
.ex-info{flex:1}
.ex-name{font-size:13px;font-weight:500}
.ex-detail{font-size:11px;color:var(--text2);margin-top:1px;font-family:'DM Mono',monospace}
.ex-note-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;resize:none;margin-top:4px;outline:none}
.ex-note-input:focus{border-color:var(--accent2)}
.session-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.session-note-area{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;resize:none;outline:none;min-height:50px}
.session-note-area:focus{border-color:var(--accent2)}
.btn-complete{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;transition:all .15s;font-weight:500;flex-shrink:0;white-space:nowrap}
.btn-complete.done{background:var(--green);color:#000}
.btn-complete.pending{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.session-completed-banner{padding:10px 16px;background:rgba(71,255,160,.08);border-top:1px solid rgba(71,255,160,.2);font-size:12px;color:var(--green);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:6px}

/* WEEK VIEW */
.week-grid{display:grid;gap:8px;margin-bottom:16px}
.week-day-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.week-day-row.completed{border-color:var(--green);background:var(--surface);box-shadow:inset 3px 0 0 0 var(--green)}
.week-day-row.today-row{border-color:var(--accent);background:var(--surface);box-shadow:inset 3px 0 0 0 var(--accent)}
.week-day-row.today-row .wdr-name{font-weight:700}
.wdr-day{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);min-width:26px;letter-spacing:.04em}
.wdr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wdr-name{font-size:13px;font-weight:500;flex:1}
.wdr-status{font-size:10px;font-family:'DM Mono',monospace;font-weight:600;flex-shrink:0}
.status-done{color:#0a0a0f;background:var(--green);padding:2px 8px;border-radius:99px}
.status-today{color:#0a0a0f;background:var(--accent);padding:2px 8px;border-radius:99px}
.status-upcoming{color:var(--text2);font-weight:400}

/* HISTORY */
.hist-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.hist-date{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);margin-bottom:4px}
.hist-name{font-size:13px;font-weight:500;margin-bottom:6px}
.hist-stats{display:flex;gap:10px;flex-wrap:wrap}
.hist-stat{font-size:10px;font-family:'DM Mono',monospace;background:var(--surface2);padding:3px 8px;border-radius:6px;color:var(--text2)}
.hist-note{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5;font-style:italic}

/* PROGRAM */
.phase-hdr{margin-bottom:10px;padding:12px 14px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.phase-title-txt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.phase-sub{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);margin-top:2px}
.prog-day{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.prog-day-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.prog-day-body{display:none;border-top:1px solid var(--border)}
.prog-day-body.open{display:block}
.prog-ex-row{padding:8px 14px;border-top:1px solid rgba(42,42,56,.5);display:flex;gap:8px;align-items:flex-start}
.prog-ex-row:first-child{border-top:none}
.prog-bullet{width:5px;height:5px;border-radius:50%;background:var(--accent2);flex-shrink:0;margin-top:6px}
.prog-bullet.run{background:var(--green)}
.prog-bullet.core{background:var(--accent)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--accent)}
.stat-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.stat-sub{font-size:11px;color:var(--text2);margin-top:2px}
.streak-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.streak-dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)}
.streak-dot.done{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
.streak-dot.today{border-color:var(--accent);color:var(--accent)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 0;padding-bottom:calc(10px + var(--safe));z-index:20;display:flex;justify-content:space-around}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:color .15s}
.bnav-btn.active{color:var(--accent)}
.bnav-icon{font-size:22px;line-height:1}
.bnav-lbl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px;padding-bottom:calc(20px + var(--safe));max-height:80vh;overflow-y:auto}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;margin-bottom:16px}
.modal-close{float:right;background:var(--surface2);border:none;color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--accent2)}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#000;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:opacity .15s}
.btn-primary:active{opacity:.8}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px;font-family:'DM Mono',monospace}

/* PHASE SELECTOR */
.phase-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.phase-sel::-webkit-scrollbar{display:none}
.phase-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.phase-pill.active{background:var(--accent2);color:#000;border-color:var(--accent2);font-weight:500}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;margin-bottom:12px;padding-top:4px}
.divider{height:1px;background:var(--border);margin:16px 0}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;font-family:'DM Mono',monospace;letter-spacing:.03em}
.badge-str{background:rgba(71,168,255,.15);color:var(--accent2)}
.badge-run{background:rgba(71,255,160,.15);color:var(--green)}
.badge-core{background:rgba(194,214,128,.15);color:var(--accent)}
.badge-mob{background:rgba(255,107,71,.15);color:var(--accent3)}

.note-note{font-size:12px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:8px 10px;line-height:1.55;margin:10px 16px 12px;border-left:2px solid var(--accent2)}

/* EXERCISE DEMO */
.ex-info-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--accent2);font-size:13px;font-family:'DM Mono',monospace;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ex-info-btn:active{background:var(--accent2);color:#000}
.demo-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
.demo-modal-overlay.open{display:flex}
.demo-modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px calc(20px + var(--safe));max-height:88vh;overflow-y:auto}
.demo-modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.demo-modal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.5px;color:var(--text);flex:1;padding-right:12px;line-height:1.1}
.demo-modal-close{background:var(--surface2);border:none;color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.demo-detail-lbl{font-size:11px;font-family:'DM Mono',monospace;color:var(--accent2);letter-spacing:.06em;margin-bottom:16px}
.demo-anim-wrap{background:var(--surface2);border-radius:16px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:200px}
.demo-anim-wrap svg{width:100%;max-width:340px;height:auto}
.demo-cues{list-style:none;margin:0;padding:0}
.demo-cue{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.4}
.demo-cue:first-child{border-top:none}
.demo-cue-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1;flex-shrink:0;width:18px}

/* DEMO VIDEO EMBED */
.demo-anim-wrap{padding:0;min-height:0;background:transparent;display:block}
.demo-video{position:relative;width:100%;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}
.demo-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.demo-vid-cap{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);margin:8px 0 10px;letter-spacing:.03em}
.demo-links{display:flex;gap:8px;margin-bottom:14px}
.demo-link{flex:1;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.03em;transition:opacity .15s}
.demo-link.yt{background:#ff0000;color:#fff}
.demo-link.alt{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.demo-link:active{opacity:.8}
.demo-searchcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 20px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;text-decoration:none;margin-bottom:14px;transition:border-color .15s}
.demo-searchcard:active{border-color:var(--accent2)}
.demo-play{width:54px;height:54px;border-radius:50%;background:#ff0000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px}
.demo-search-txt{font-size:14px;font-weight:500;color:var(--text)}
.demo-search-sub{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)}
/* EXERCISE ANIMATION (primary visual) */
.demo-figure{width:100%;aspect-ratio:11/10;background:radial-gradient(circle at 50% 42%,rgba(71,168,255,0.10),rgba(194,214,128,0.04) 55%,transparent 72%);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.demo-figure svg{width:100%;height:100%;display:block}
.demo-actions{display:flex;gap:8px;margin-top:10px}
.demo-act{flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#0a0a0f;font-weight:700;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;text-decoration:none;letter-spacing:.01em}
.demo-act.ghost{flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-weight:500}
.demo-act:active{opacity:.82}
.demo-anim-note{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);text-align:center;margin:9px 0 12px;letter-spacing:.02em}
.demo-back{width:100%;margin-bottom:14px;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;cursor:pointer}
.demo-back:active{border-color:var(--accent2)}
.demo-loading{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#000;border-radius:14px;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px}

/* CALENDAR */
.cal-summary{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:6px}
.cal-sum-row{display:flex;align-items:flex-end;justify-content:space-between}
.cal-sum-big{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:.9;color:var(--accent)}
.cal-sum-big span{font-size:20px;color:var(--text2)}
.cal-today-btn{padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.04em;cursor:pointer}
.cal-today-btn:active{border-color:var(--accent);color:var(--accent)}
.cal-sum-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.cal-sum-bar{height:6px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:10px;overflow:hidden}
.cal-sum-bar div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .4s ease}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 12px}
.cal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--text)}
.cal-nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;line-height:1}
.cal-nav:active{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{margin-bottom:6px}
.cal-dow-cell{text-align:center;font-size:10px;font-family:'DM Mono',monospace;color:var(--text2)}
.cal-cell{position:relative;aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal-cell.noplan{background:transparent;border-color:transparent}
.cal-cell.out{opacity:.32}
.cal-num{font-size:13px;font-family:'DM Mono',monospace;color:var(--text2);line-height:1}
.cal-cell.noplan .cal-num{color:var(--text3)}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-mark{font-size:11px;font-weight:700;line-height:1}
.cal-cell.s-done{background:var(--accent2);border-color:var(--accent2)}
.cal-cell.s-done .cal-num{color:#04101d;font-weight:700}
.cal-cell.s-done .cal-mark{color:#04101d}

function loadState(){try{return JSON.parse(localStorage.getItem('mt_state')||'{}')}catch(e){return{}}}
function saveState(s){localStorage.setItem('mt_state',JSON.stringify(s))}
let STATE = loadState();
if(!STATE.completedExercises) STATE.completedExercises={};
if(!STATE.completedSessions) STATE.completedSessions={};
if(!STATE.sessionNotes) STATE.sessionNotes={};
if(!STATE.exerciseNotes) STATE.exerciseNotes={};
if(!STATE.exerciseRPE) STATE.exerciseRPE={};
// One-time cleanup: older builds auto-ticked every exercise when a session was marked
// "done", and those ticks were saved. Clear them once so exercise checks reflect only
// your own taps from now on. Session "done" status and notes/RPE are preserved.
if(!STATE.autoTickCleared){ STATE.completedExercises={}; STATE.autoTickCleared=true; saveState(STATE); }

// HELPERS
// ─────────────────────────────────────────
function formatDate(d){const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()}
function sessionKey(s){return `p${s.phase}_w${s.week}_${s.day}`}
function getSessionsForDate(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const start=new Date(PLAN_START);start.setHours(0,0,0,0);
  const diffDays=Math.round((d-start)/(1000*60*60*24));
  if(diffDays<0||diffDays>=84) return [];
  const week=Math.floor(diffDays/7)+1;
  if(week<1||week>12) return [];
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayOfWeek=dayNames[(d.getDay()+6)%7];
  return PROGRAM.filter(s=>s.week===week&&s.day===dayOfWeek);
}
function getWeekSessions(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  const dow=(d.getDay()+6)%7;
  const monday=new Date(d);monday.setDate(d.getDate()-dow);
  const sessions=[];
  for(let i=0;i<7;i++){
    const day=new Date(monday);day.setDate(monday.getDate()+i);
    const ss=getSessionsForDate(day);
    sessions.push({date:day,sessions:ss});
  }
  return sessions;
}
function totalCompleted(){return Object.keys(STATE.completedSessions).filter(k=>STATE.completedSessions[k]).length}
function dotClass(type){return type==='strength'?'dot-strength':type==='run'?'dot-run':type==='combo'?'dot-combo':'dot-rest'}
function typeClass(type){return type==='strength'?'type-strength':type==='run'?'type-run':type==='combo'?'type-combo':'type-rest'}
function typeLabel(type){return type==='strength'?'Strength':type==='run'?'Run':type==='combo'?'Run+Lift':'Rest'}

// ─────────────────────────────────────────
// COUNTDOWN
// ─────────────────────────────────────────
function updateCountdown(){
  const now=new Date();
  const diff=RACE_DATE-now;
  if(diff<=0){document.getElementById('cd-days').textContent='0';document.getElementById('cd-weeks').textContent='0';document.getElementById('cd-sessions').textContent='0';return;}
  const days=Math.ceil(diff/(1000*60*60*24));
  const weeks=Math.ceil(days/7);
  const done=totalCompleted();
  const remaining=Math.max(0,84-done);
  document.getElementById('cd-days').textContent=days;
  document.getElementById('cd-weeks').textContent=weeks;
  document.getElementById('cd-sessions').textContent=remaining;
  const pct=Math.round((done/84)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('hdr-progress').textContent=done+' / 84 sessions';
}

let currentSection='today';
function showSection(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const bnMap={today:'bn-today',week:'bn-week',calendar:'bn-calendar',program:'bn-program',history:'bn-history',stats:'bn-stats',pace:'bn-pace'};
  const bnId=bnMap[id];if(bnId){const b=document.getElementById(bnId);if(b)b.classList.add('active');}
  const navBtns=document.querySelectorAll('.nav-btn');
  const order=['today','week','calendar','program','history','stats','pace'];
  const idx=order.indexOf(id);
  if(idx>=0&&navBtns[idx]) navBtns[idx].classList.add('active');
  currentSection=id;
  if(id==='today') renderToday();
  else if(id==='week') renderWeek();
  else if(id==='calendar') renderCalendar();
  else if(id==='history') renderHistory();
  else if(id==='stats') renderStats();
  else if(id==='pace') pcEnsureInit();
}

function renderToday(){
  const today=new Date();
  document.getElementById('today-date-lbl').textContent=formatDate(today).toUpperCase();
  const sessions=getSessionsForDate(today);
  const container=document.getElementById('today-sessions');
  if(sessions.length===0){
    container.innerHTML=`<div class="empty"><div class="empty-icon">📅</div><div class="empty-txt">No sessions scheduled today.<br><br>Plan starts ${formatDate(PLAN_START)}</div></div>`;
    return;
  }
  container.innerHTML=sessions.map(s=>renderSessionCard(s,true)).join('');
}

function renderSessionCard(s,interactive){
  const key=sessionKey(s);
  const done=STATE.completedSessions[key];
  const totalEx=s.exercises.length;
  const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
  const dur=estimateDuration(s);
  return `<div class="session-card" id="card-${key}">
    <div class="session-hdr" onclick="toggleSession('${key}')">
      <div class="session-dot ${dotClass(s.type)}"></div>
      <div class="session-name">${s.name}</div>
      <span class="dur-badge">⏱ ${dur} min</span>
      <span class="session-type ${typeClass(s.type)}">${typeLabel(s.type)}</span>
      <div class="chev" id="chev-${key}">›</div>
    </div>
    ${done?`<div class="session-completed-banner">✓ COMPLETED · ${doneEx}/${totalEx} exercises logged</div>`:''}
    <div class="session-body" id="body-${key}">
      ${renderExercises(s,interactive)}
      ${s.type!=='rest'?renderOptional(s):''}
      ${s.note?`<div class="note-note">${s.note}</div>`:''}
      <div class="load-strip" id="load-${key}">${loadStripInner(s)}</div>
      <div class="session-footer">
        <textarea class="session-note-area" placeholder="Session notes…" id="snote-${key}" oninput="saveSessionNote('${key}',this.value)">${STATE.sessionNotes[key]||''}</textarea>
        <button class="btn-complete ${done?'done':'pending'}" id="cbtn-${key}" onclick="toggleSessionComplete('${key}')">${done?'DONE ✓':'MARK DONE'}</button>
      </div>
    </div>
  </div>`;
}

function renderExercises(s,interactive){
  let html='';
  let lastCat='';
  s.exercises.forEach(e=>{
    const cat=e.cat==='core'?'core':e.cat==='run'?'run':'lift';
    if(cat!==lastCat){
      const lbl=e.cat==='core'?'Core finisher':e.cat==='run'?'Running':e.cat==='rest'?'Recovery':'Strength';
      html+=`<div class="ex-section-lbl">${lbl}</div>`;
      lastCat=cat;
    }
    const done=STATE.completedExercises[e.id];
    const dotCol=e.cat==='run'?'run':e.cat==='core'?'core':'';
    html+=`<div class="ex-row">
      <div class="ex-check ${done?'done':''}" onclick="toggleExercise('${e.id}','${sessionKey(s)}')"></div>
      <div class="ex-info">
        <div class="ex-name" style="${done?'text-decoration:line-through;opacity:.5':''}">${e.name}</div>
        <div class="ex-detail">${e.detail}</div>
        <input class="ex-note-input" type="text" placeholder="Weight / reps / notes…" value="${STATE.exerciseNotes[e.id]||''}" oninput="saveExNote('${e.id}',this.value)">
        ${rpeControlHTML(e.id, sessionKey(s))}
      </div>
      <button class="ex-info-btn" onclick="showExDemo('${e.name.replace(/'/g,"\\'")}','${e.detail.replace(/'/g,"\\'")}')">ⓘ</button>
    </div>`;
  });
  return html;
}

function toggleSession(key){
  const body=document.getElementById('body-'+key);
  const chev=document.getElementById('chev-'+key);
  if(!body) return;
  const open=body.classList.toggle('open');
  if(chev) chev.style.transform=open?'rotate(90deg)':'';
}
function toggleExercise(exId,sessKey){
  STATE.completedExercises[exId]=!STATE.completedExercises[exId];
  saveState(STATE);
  updateCountdown();
  // Surgical DOM update — no full re-render so the page never jumps
  const done=STATE.completedExercises[exId];
  const chk=document.querySelector(`.ex-check[onclick*="'${exId}'"]`);
  if(chk){
    chk.classList.toggle('done',done);
    const nameEl=chk.nextElementSibling&&chk.nextElementSibling.querySelector('.ex-name');
    if(nameEl) nameEl.style.cssText=done?'text-decoration:line-through;opacity:.5':'';
  }
  // Update the session completed-banner exercise count
  const s=PROGRAM.find(x=>sessionKey(x)===sessKey);
  if(s){
    const card=document.getElementById('card-'+sessKey);
    if(card){
      const doneEx=s.exercises.filter(e=>STATE.completedExercises[e.id]).length;
      const banner=card.querySelector('.session-completed-banner');
      if(banner) banner.textContent=`✓ COMPLETED · ${doneEx}/${s.exercises.length} exercises logged`;
    }
  }
}
function toggleSessionComplete(key){
  STATE.completedSessions[key]=!STATE.completedSessions[key];
  // Note: marking a session done records it as complete but leaves each
  // exercise's tick exactly as the user set it (no auto-ticking).
  saveState(STATE);
  updateCountdown();
  if(currentSection==='today') renderToday();
  else if(currentSection==='calendar') renderCalendar();
  else if(currentSection==='week') renderWeek();
  else renderHistory();
}
function saveSessionNote(key,val){STATE.sessionNotes[key]=val;saveState(STATE);}
function saveExNote(exId,val){STATE.exerciseNotes[exId]=val;saveState(STATE);}

// ─────────────────────────────────────────
// RPE (CR-10 / Reps-in-Reserve) + SESSION-RPE TRAINING LOAD (Foster's method)
// ─────────────────────────────────────────
const RPE_OPTS = [
  [10,'10 · Max — 0 reps left'],[9,'9 · 1 rep in reserve'],[8,'8 · 2 in reserve'],
  [7,'7 · 3 in reserve — very hard'],[6,'6 · 4 in reserve'],[5,'5 · hard'],
  [4,'4 · somewhat hard'],[3,'3 · moderate'],[2,'2 · easy'],[1,'1 · very easy']
];
function rpeControlHTML(exId, sessKey){
  const cur = STATE.exerciseRPE[exId];
  const opts = '<option value="">RPE –</option>' + RPE_OPTS.map(o=>
    '<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
  return '<div class="rpe-wrap"><span class="rpe-lbl">RPE</span>'
    + '<select class="rpe-sel'+(typeof cur==='number'?' set':'')+'" onchange="setRPE(\''+exId+'\',\''+sessKey+'\',this.value)">'
    + opts + '</select></div>';
}
function setRPE(exId, sessKey, val){

// End-of-week load monitor: totals session-RPE load for the displayed week and flags overtraining risk
function _weekLoadSum(monday){
  const m=dailyLoadMap(); let sum=0; const days=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); const L=m[_ymd(d)]||0; sum+=L; days.push(L); }
  return {sum, days};
}
function weekMonitorHTML(monday){
  const cur=_weekLoadSum(monday);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  const range=monday.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][monday.getMonth()]
            +' – '+sunday.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][sunday.getMonth()];
  const wrap=(inner)=>'<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'
    +'<div style="font-size:10px;font-family:\'DM Mono\',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.06em">WEEK LOAD · OVERTRAINING MONITOR</div>'
    +'<div style="font-size:10px;font-family:\'DM Mono\',monospace;color:var(--text3)">'+range+'</div></div>'+inner+'</div>';
  if(cur.sum===0){
    return wrap('<div class="ls-hint">No training load logged for this week yet. Add an RPE to each exercise and the weekly total, ramp and overtraining risk will appear here.</div>');
  }
  // prior up to 4 weeks for chronic baseline & week-over-week
  const prevSums=[];
  for(let w=1;w<=4;w++){ const pm=new Date(monday); pm.setDate(monday.getDate()-7*w); prevSums.push(_weekLoadSum(pm).sum); }
  const lastWk=prevSums[0];
  const priorNZ=prevSums.filter(v=>v>0);
  const chronicAvg=priorNZ.length? priorNZ.reduce((a,b)=>a+b,0)/priorNZ.length : 0;
  const ratio = chronicAvg>0 ? cur.sum/chronicAvg : null;     // weekly acute:chronic
  const wow = lastWk>0 ? (cur.sum-lastWk)/lastWk*100 : null;   // week-over-week %
  const mean=cur.sum/7, sd=_sd(cur.days);
  const monotony = (sd>0) ? mean/sd : null;
  const strain = monotony!=null ? Math.round(cur.sum*monotony) : null;
  // risk assessment
  let level=0; const reasons=[];
  if(ratio!=null){
    if(ratio>1.5){ level=2; reasons.push('load ratio '+ratio.toFixed(2)+' vs 4-wk avg (&gt;1.5)'); }
    else if(ratio>1.3){ level=Math.max(level,1); reasons.push('load ratio '+ratio.toFixed(2)+' (1.3–1.5)'); }
  }
  if(wow!=null && wow>10){ level=Math.max(level,1); reasons.push('+'+Math.round(wow)+'% vs last week (&gt;10% jump)'); }
  if(monotony!=null && monotony>2){ level=Math.max(level,1); reasons.push('monotony '+monotony.toFixed(1)+' (&gt;2 — too even)'); }
  let banner;
  if(ratio==null && level===0){
    banner=['tl-low','Building baseline','Keep logging — a few weeks of data lets the acute:chronic ratio flag spikes.'];
  } else if(level===2){
    banner=['tl-bad','High overtraining risk','Your load has spiked well above recent weeks. Consider an easier day, more recovery, or trimming volume.'];
  } else if(level===1){
    banner=['tl-warn','Caution','Load is climbing faster than ideal. Hold steady or add variety rather than pushing harder this week.'];
  } else {
    banner=['tl-ok','Sustainable','Load is progressing within a safe range. Keep it gradual (≈10%/week).'];
  }
  const wowTxt = wow!=null ? ((wow>=0?'+':'')+Math.round(wow)+'% vs last week') : 'first logged week';
  const rows='<div class="tl-grid">'
    + '<div class="tl-card"><div class="tl-val">'+cur.sum+'</div><div class="tl-lbl">Total week load (AU)</div><div style="font-size:10px;font-family:\'DM Mono\',monospace;color:var(--text3);margin-top:4px">'+wowTxt+'</div></div>'
    + '<div class="tl-card"><div class="tl-val">'+(ratio!=null?ratio.toFixed(2):'—')+'</div><div class="tl-lbl">Load ratio vs 4-wk avg</div></div>'
    + '<div class="tl-card"><div class="tl-val">'+(monotony!=null?monotony.toFixed(2):'—')+'</div><div class="tl-lbl">Monotony</div></div>'
    + '<div class="tl-card"><div class="tl-val">'+(strain!=null?strain:'—')+'</div><div class="tl-lbl">Strain (AU)</div></div>'
    + '</div>';
  const reasonTxt = reasons.length? '<div style="font-size:10px;font-family:\'DM Mono\',monospace;color:var(--text2);margin-top:6px">Flags: '+reasons.join(' · ')+'</div>' : '';
  const status='<div style="margin-top:4px;padding:11px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border)">'
    + '<span class="tl-band '+banner[0]+'">'+banner[1]+'</span>'
    + '<div style="font-size:12px;color:var(--text);margin-top:7px;line-height:1.5">'+banner[2]+'</div>'
    + reasonTxt + '</div>';
  return wrap(rows+status);
}

// Training-load analytics — Foster session-RPE load + Gabbett acute:chronic workload ratio
function sessionDate(s){
  const dow={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[s.day];
  const start=new Date(PLAN_START); start.setHours(0,0,0,0);
  const offsetInBlock=(dow - start.getDay() + 7)%7;   // align to real calendar weekday within the week-block
  const dt=new Date(start);
  dt.setDate(start.getDate() + (s.week-1)*7 + offsetInBlock);
  return dt;
}
function dailyLoadMap(){
  const m={};
  PROGRAM.forEach(s=>{ const L=sessionLoad(s); if(L>0){ const k=_ymd(sessionDate(s)); m[k]=(m[k]||0)+L; } });
  return m;
}
function loadWindow(days){
  const m=dailyLoadMap(); const end=new Date(); end.setHours(0,0,0,0);
  const arr=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(end); d.setDate(end.getDate()-i); arr.push({d:new Date(d), load:m[_ymd(d)]||0}); }
  return arr;
}
function _sd(arr){ if(arr.length<1) return 0; const m=arr.reduce((a,b)=>a+b,0)/arr.length; const v=arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length; return Math.sqrt(v); }
function trainingLoadCardHTML(){
  const map=dailyLoadMap();

  if(dayKeys.length===0){
    return wrap('<div class="ls-hint">Rate your exercises by RPE on each session to unlock weekly load, monotony, strain and your acute:chronic workload ratio.</div>');

  const acute=w7.reduce((a,b)=>a+b.load,0);
  const chronic=w28.reduce((a,b)=>a+b.load,0)/4;
  const dailies7=w7.map(x=>x.load), mean7=acute/7, sd7=_sd(dailies7);
  const monotony = sd7>0 ? mean7/sd7 : null;
  const strain = monotony!=null ? Math.round(acute*monotony) : null;
  const earliest=new Date(dayKeys.sort()[0]); const today0=new Date(); today0.setHours(0,0,0,0);
  const spanDays=Math.round((today0-earliest)/864e5);
  const acwrReady = spanDays>=14 && chronic>0;
  const acwr = acwrReady ? acute/chronic : null;
  // bands

  const maxL=Math.max(1,...w14.map(x=>x.load));

    + '<div class="tl-card"><div class="tl-val">'+(monotony!=null?monotony.toFixed(2):'—')+'</div><div class="tl-lbl">Monotony</div><span class="tl-band '+monBand[0]+'">'+monBand[1]+'</span></div>'
    + '<div class="tl-card"><div class="tl-val">'+(strain!=null?strain:'—')+'</div><div class="tl-lbl">Strain (AU)</div></div>'
    + '</div>'
    + '<div style="font-size:9.5px;font-family:\'DM Mono\',monospace;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px">Daily load · last 14 days</div>'
    + '<div class="tl-bars">'+bars+'</div>'
    + '<div class="tl-method">Load = session&nbsp;RPE × duration (Foster, AU). Acute = 7-day sum; chronic = 28-day ÷ 4. ACWR sweet-spot ≈ 0.8–1.3; &gt;1.5 = elevated injury risk (Gabbett). Monotony = mean ÷ SD of daily load; keep &lt; 2 (Foster). Strain = weekly load × monotony.</div>';
  return wrap(inner);

// CALENDAR — month overview of completed / missed / upcoming sessions
// ─────────────────────────────────────────
let calMonth = null;      // Date pinned to the 1st of the displayed month
let calSelected = null;   // 'YYYY-MM-DD' of the tapped day (detail panel)
function _ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function calInitMonth(){
  if(calMonth) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const ps=new Date(PLAN_START); ps.setHours(0,0,0,0);
  const base = today<ps ? ps : today;
  calMonth = new Date(base.getFullYear(), base.getMonth(), 1);
}
function calShift(delta){ calInitMonth(); calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()+delta, 1); renderCalendar(); }
function calPrev(){ calShift(-1); }
function calNext(){ calShift(1); }
function calJumpToday(){ calMonth=null; calSelected=_ymd(new Date()); calInitMonth(); renderCalendar(); }
function calSelect(iso){ calSelected = (calSelected===iso ? null : iso); renderCalendar(); }
function calDayStatus(date){
  const sessions=getSessionsForDate(date);
  if(sessions.length===0) return {inPlan:false};
  const today=new Date(); today.setHours(0,0,0,0);
  const dd=new Date(date); dd.setHours(0,0,0,0);
  const doneCount=sessions.filter(s=>STATE.completedSessions[sessionKey(s)]).length;
  const complete=doneCount===sessions.length;
  const partial=doneCount>0 && !complete;
  const allRest=sessions.every(s=>s.type==='rest');
  const isToday=_sameDay(dd,today);
  const isPast=dd<today;
  let status;
  if(complete) status='done';
  else if(allRest) status='rest';
  else if(isPast) status='missed';
  else status='future';
  const main=sessions.find(s=>s.type!=='rest')||sessions[0];
  return {inPlan:true, sessions, status, partial, isToday, type:main.type};
}
function renderCalendar(){
  calInitMonth();
  const view=document.getElementById('calendar-view');
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y=calMonth.getFullYear(), mo=calMonth.getMonth();
  const totalDone=totalCompleted();
  let html='';
  html+='<div class="cal-summary">'
    + '<div class="cal-sum-row"><div class="cal-sum-big">'+totalDone+'<span>/84</span></div>'
    + '<button class="cal-today-btn" onclick="calJumpToday()">Jump to today</button></div>'
    + '<div class="cal-sum-lbl">sessions completed</div>'
    + '<div class="cal-sum-bar"><div style="width:'+Math.round(totalDone/84*100)+'%"></div></div>'
    + '</div>';
  html+='<div class="cal-head">'
    + '<button class="cal-nav" onclick="calPrev()" aria-label="Previous month">‹</button>'
    + '<div class="cal-title">'+months[mo]+' '+y+'</div>'
    + '<button class="cal-nav" onclick="calNext()" aria-label="Next month">›</button>'
    + '</div>';
  html+='<div class="cal-grid cal-dow">'+['M','T','W','T','F','S','S'].map(d=>'<div class="cal-dow-cell">'+d+'</div>').join('')+'</div>';
  const first=new Date(y,mo,1);
  const startOffset=(first.getDay()+6)%7;       // 0 = Monday
  const gridStart=new Date(y,mo,1-startOffset);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const inMonth=d.getMonth()===mo;
    const st=calDayStatus(d);
    const iso=_ymd(d);
    let cls='cal-cell';
    if(!inMonth) cls+=' out';
    if(st.inPlan){
      cls+=' s-'+st.status;
      if(st.partial) cls+=' partial';
      if(st.isToday) cls+=' today-ring';
      if(calSelected===iso) cls+=' sel';
    } else { cls+=' noplan'; }
    let inner='<div class="cal-num">'+d.getDate()+'</div>';
    if(st.inPlan){
      if(st.status==='done') inner+='<div class="cal-mark">✓</div>';
      else if(st.status==='missed') inner+='<div class="cal-mark miss">!</div>';
      else if(st.status==='rest') inner+='<div class="cal-dot dot-rest"></div>';
      else inner+='<div class="cal-dot '+dotClass(st.type)+'"></div>';
    }
    const click=st.inPlan?(' onclick="calSelect(\''+iso+'\')"'):'';
    cells+='<div class="'+cls+'"'+click+'>'+inner+'</div>';
  }
  html+='<div class="cal-grid cal-days">'+cells+'</div>';
  html+='<div class="cal-legend">'
    + '<span class="cal-leg"><i class="lg done"></i>Done</span>'
    + '<span class="cal-leg"><i class="lg today"></i>Today</span>'
    + '<span class="cal-leg"><i class="lg missed"></i>Missed</span>'
    + '<span class="cal-leg"><i class="lg future"></i>Upcoming</span>'
    + '<span class="cal-leg"><i class="lg rest"></i>Rest</span>'
    + '</div>';
  if(calSelected){
    const p=calSelected.split('-').map(Number);
    const sd=new Date(p[0],p[1]-1,p[2]);
    const ss=getSessionsForDate(sd);
    if(ss.length){
      html+='<div class="cal-detail"><div class="cal-detail-date">'+formatDate(sd).toUpperCase()+'</div>'
        + ss.map(s=>renderSessionCard(s,true)).join('')
        + '</div>';
    }
  }
  view.innerHTML=html;
}

const NO_VIDEO = ['complete rest','active recovery','walk','gentle walk','fuel early','trust your training','rest + mobility'];

function normExName(name){
  return name.toLowerCase()
    .replace(/\s*[-–—]\s*(deload|eccentric|slow|light|heavy|heavier|loaded|max height|add.*|same.*|drop.*)$/i,'')
    .replace(/\s+/g,' ').trim();
}
function resolveVideoKey(name){
  let n = normExName(name);
  if(EXERCISE_VIDEOS[n]) return n;
  if(VIDEO_ALIASES[n]) return VIDEO_ALIASES[n];
  // running family
  if(n==='long run') return 'long run';
  if(RUN_WORDS.includes(n)){
    if(['tempo','threshold','interval run','race-pace','race-pace segments'].includes(n)) return 'tempo';
    return 'easy run';
  }
  if(NO_VIDEO.includes(n)) return null;
  // strip parenthetical and retry
  const stripped = n.replace(/\s*\([^)]*\)/g,'').trim();
  if(EXERCISE_VIDEOS[stripped]) return stripped;
  if(VIDEO_ALIASES[stripped]) return VIDEO_ALIASES[stripped];
  // substring match against canonical keys
  const keys = Object.keys(EXERCISE_VIDEOS);
  const hit = keys.find(k => stripped.includes(k) || k.includes(stripped.split(' ').slice(0,2).join(' ')));
  return hit || null;
}
function ytSearchUrl(name){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' exercise proper form technique');
}

const ANIM_BONES = [['sh','hip'],['hip','knee'],['knee','ankle'],['ankle','toe'],['sh','elb'],['elb','hand'],['hip','kneeB'],['kneeB','ankleB'],['ankleB','toeB']];
function _animTag(attr,a,b,dur){
  return '<animate attributeName="'+attr+'" values="'+a+';'+b+';'+a+'" dur="'+dur+'s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>';
}
function _bone(p,q,A,B,dur){
  if(!A[p]||!A[q]||!B[p]||!B[q]) return '';
  const arm = (p==='sh'&&q==='elb')||(p==='elb'&&q==='hand');
  const col = arm ? 'var(--accent)' : 'var(--accent2)';
  return '<line x1="'+A[p][0]+'" y1="'+A[p][1]+'" x2="'+A[q][0]+'" y2="'+A[q][1]+'" stroke="'+col+'" stroke-width="5" stroke-linecap="round">'
    + _animTag('x1',A[p][0],B[p][0],dur)+_animTag('y1',A[p][1],B[p][1],dur)
    + _animTag('x2',A[q][0],B[q][0],dur)+_animTag('y2',A[q][1],B[q][1],dur)+'</line>';
}
function _joint(name,A,B,r,dur,fill){
  if(!A[name]||!B[name]) return '';
  return '<circle cx="'+A[name][0]+'" cy="'+A[name][1]+'" r="'+r+'" fill="'+(fill||'var(--accent2)')+'">'
    + _animTag('cx',A[name][0],B[name][0],dur)+_animTag('cy',A[name][1],B[name][1],dur)+'</circle>';
}
function buildFigure(A,B,opts){
  opts=opts||{};
  const dur=opts.dur||2.2;
  let s='<svg viewBox="0 0 220 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  s+='<line x1="10" y1="184" x2="210" y2="184" stroke="rgba(255,255,255,0.13)" stroke-width="3" stroke-linecap="round"/>';
  if(opts.bar) s+='<line x1="58" y1="28" x2="152" y2="28" stroke="rgba(255,255,255,0.32)" stroke-width="5" stroke-linecap="round"/>';
  if(opts.box) s+='<rect x="100" y="150" width="44" height="34" rx="3" fill="rgba(194,214,128,0.08)" stroke="rgba(194,214,128,0.28)" stroke-width="2"/>';
  if(opts.band){
    s+='<line x1="'+A.hand[0]+'" y1="'+A.hand[1]+'" x2="198" y2="'+(opts.bandY!=null?opts.bandY:A.hand[1])+'" stroke="rgba(255,107,71,0.75)" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round">'
      +_animTag('x1',A.hand[0],B.hand[0],dur)+_animTag('y1',A.hand[1],B.hand[1],dur)+'</line>';
  }
  ANIM_BONES.forEach(b=> s+=_bone(b[0],b[1],A,B,dur));
  s+=_joint('head',A,B,9,dur);
  if(opts.load) s+=_joint('hand',A,B,5.5,dur,'var(--accent3)');
  s+='</svg>';

}

// ── YouTube IFrame Player API loader (loaded once, on demand) ──
// Using the Player API (not a bare iframe) lets us catch onError events for
// videos that are removed, private, or have embedding disabled, and fall back
// to the guaranteed search card. This is what makes "every link works" true.
let _ytApiState = 'none'; // none | loading | ready | failed
const _ytApiQueue = [];
function loadYTApi(){
  if(_ytApiState === 'ready' || _ytApiState === 'loading') return;
  _ytApiState = 'loading';
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function(){
    if(typeof prev === 'function'){ try{ prev(); }catch(e){} }
    _ytApiState = 'ready';
    _ytApiQueue.splice(0).forEach(fn=>{ try{ fn(); }catch(e){} });
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function(){ _ytApiState = 'failed'; _ytApiQueue.splice(0).forEach(fn=>{ try{ fn(); }catch(e){} }); };
  document.head.appendChild(tag);
  // safety net: if the API never signals ready, treat as failed so we can
  // still fall back to a plain iframe rather than hanging.
  setTimeout(function(){ if(_ytApiState === 'loading'){ _ytApiState='failed'; _ytApiQueue.splice(0).forEach(fn=>{ try{ fn(); }catch(e){} }); } }, 6000);
}
function whenYTApi(cb){
  if(_ytApiState === 'ready' || _ytApiState === 'failed'){ cb(); return; }
  _ytApiQueue.push(cb); loadYTApi();
}

// BACKUP view: the real YouTube clip, played INSIDE the app — falls back to the animation if it can't embed
function playExVideo(){
  if(!_demoCtx) return;
  const token = ++_demoToken;
  const c = _demoCtx;
  const animEl = document.getElementById('demo-anim');
  const back = '<button class="demo-back" onclick="renderDemoAnimView()">↺ Back to animation</button>';
  if(!(c.data && c.data.id)){
    fallToAnim('No clip linked for this one — showing the animated guide. Use “Open on YouTube” to search demos.');
    return;
  }
  animEl.innerHTML = '<div class="demo-loading">Loading video…</div>' + back;
  whenYTApi(function(){
    if(token !== _demoToken) return;
    if(_ytApiState === 'failed' || !(window.YT && window.YT.Player)){
      animEl.innerHTML = demoIframeHTML(c.data, c.searchUrl) + back; // best effort, links still work
      return;
    }
    animEl.innerHTML = '<div class="demo-video"><div id="demo-yt-mount"></div></div>' + demoLinksHTML(c.data, c.searchUrl) + back;
    const onPlayFail = function(){
      if(token !== _demoToken) return;
      fallToAnim('This clip can’t play inside the app — here’s the animated guide. Tap “Open on YouTube” to watch the footage.');
    };
    try{
      _demoPlayer = new YT.Player('demo-yt-mount', {
        videoId: c.data.id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { rel:0, modestbranding:1, playsinline:1, autoplay:1 },
        events: { onError: function(){ onPlayFail(); } } // removed / private / embedding disabled
      });
    }catch(e){ onPlayFail(); }

// ─────────────────────────────────────────
// SESSION DURATION ESTIMATE (clamped 40–80 min)
// ─────────────────────────────────────────
function runMinutes(detail){
  const m = (detail||'').match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*km/i);
  if(m){ const km = m[2]?parseInt(m[2]):parseInt(m[1]); return Math.round(km*6.5); }
  const d=(detail||'').toLowerCase();
  if(d.includes('tempo')||d.includes('threshold')) return 25;
  if(d.includes('interval')||d.includes('race-pace')) return 30;
  if(d.includes('warm')||d.includes('cool')) return 12;
  return 15;
}
function estimateDuration(s){
  let mins = 10; // warm-up + mobility baseline
  s.exercises.forEach(e=>{
    if(e.cat==='run') mins += runMinutes(e.detail);
    else if(e.cat==='core') mins += 4;
    else if(e.cat==='rest') mins += 8;
    else mins += 6; // strength
  });
  mins = Math.round(mins/5)*5;
  return Math.max(40, Math.min(80, mins));
}

  ['Terminal knee extension','2 × 15/leg · band, lock the knee out','strength'],
  ['Eccentric step-down','2 × 10/leg · 3-sec lower, knee tracks toes','strength'],
  ['Poliquin step-up','2 × 10/leg · VMO + knee tracking','strength']
];
const SCAP_POOL = [
  ['Band pull-apart','2 × 20 · squeeze the shoulder blades together','strength'],
  ['Face pull','2 × 15 · elbows high, finish with external rotation','strength'],
  ['Scapular wall slide','2 × 12 · ribs down, blades rotate up','strength'],
  ['Serratus wall slide','2 × 12 · protract & reach at the top','strength'],
  ['Scapular pull-up','2 × 10 · depress the blades, arms straight','strength'],
  ['Prone Y-T-W raise','2 × 8 each · lower-trap activation','strength']
];
function _hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))|0; } return Math.abs(h); }
function getOptionalExercises(s){
  const pre = exPrefix(s);
  const h = _hash(pre);
  const knee = KNEE_POOL[h % KNEE_POOL.length];
  const scap = SCAP_POOL[(Math.floor(h/7)) % SCAP_POOL.length];
  return [
    {id:pre+'opt1', name:knee[0], detail:knee[1], cat:knee[2], optional:true},
    {id:pre+'opt2', name:scap[0], detail:scap[1], cat:scap[2], optional:true}
  ];
}
function renderOptional(s){
  const opts=getOptionalExercises(s);
  const doneCount=opts.filter(e=>STATE.completedExercises[e.id]).length;
  return '<div class="ex-section-lbl opt-lbl">Prehab finishers · knee + shoulder '
    + '<span class="opt-count">'+doneCount+'/2</span></div>'
    + opts.map(e=>{
      const done=STATE.completedExercises[e.id];
      return '<div class="ex-row opt-row">'
        + '<div class="ex-check '+(done?'done':'')+'" onclick="toggleExercise(\''+e.id+'\',\''+sessionKey(s)+'\')"></div>'
        + '<div class="ex-info">'
        + '<div class="ex-name" style="'+(done?'text-decoration:line-through;opacity:.5':'')+'">'+e.name+'</div>'
        + '<div class="ex-detail">'+e.detail+'</div>'
        + '<input class="ex-note-input" type="text" placeholder="Weight / reps / notes…" value="'+(STATE.exerciseNotes[e.id]||'')+'" oninput="saveExNote(\''+e.id+'\',this.value)">'
        + rpeControlHTML(e.id, sessionKey(s))
        + '</div>'
        + '<button class="ex-info-btn" onclick="showExDemo(\''+e.name.replace(/'/g,"\\'")+'\',\''+e.detail.replace(/'/g,"\\'")+'\')">ⓘ</button>'
        + '</div>';
    }).join('');
}

// ─────────────────────────────────────────
// SEARCH (exercises + weeks/sessions)
// ─────────────────────────────────────────
function openSearch(){
  document.getElementById('search-overlay').classList.add('open');
  const inp=document.getElementById('search-input');
  inp.value=''; runSearch('');
  setTimeout(()=>inp.focus(),50);
}
function closeSearch(e){
  if(!e || e.target===document.getElementById('search-overlay')){
    document.getElementById('search-overlay').classList.remove('open');
  }
}
function buildExerciseIndex(){
  const seen={}, list=[];
  PROGRAM.forEach(s=>{
    s.exercises.forEach(e=>{
      const k=e.name.toLowerCase();
      if(!seen[k]){ seen[k]=1; list.push({name:e.name, detail:e.detail, cat:e.cat}); }
    });
  });
  return list;
}
let EX_INDEX=null;
function runSearch(q){
  if(!EX_INDEX) EX_INDEX=buildExerciseIndex();
  q=(q||'').trim().toLowerCase();
  const res=document.getElementById('search-results');
  // Week / phase matches
  let weekHtml='';
  const phaseNames={1:'Foundation',2:'Build',3:'Peak',4:'Taper'};
  const wkMatch = q.match(/(?:week|wk|w)\s*(\d{1,2})/);
  let weeks=[];
  if(wkMatch){ const w=parseInt(wkMatch[1]); if(w>=1&&w<=12) weeks=[w]; }
  else if(/phase|foundation|build|peak|taper/.test(q)){
    [1,2,3,4].forEach(p=>{ if(q.includes('phase '+p)||q.includes(phaseNames[p].toLowerCase())) {PROGRAM.filter(s=>s.phase===p).forEach(s=>{if(!weeks.includes(s.week))weeks.push(s.week);});} });
  }
  if(weeks.length){
    weekHtml='<div class="srch-cat">Program weeks</div>'+weeks.slice(0,4).map(w=>{
      const s=PROGRAM.find(x=>x.week===w);
      const phase=s?s.phase:1;
      return '<div class="srch-item" onclick="gotoWeek('+w+')"><span class="srch-ico">📅</span>'
        +'<div><div class="srch-name">Week '+w+'</div><div class="srch-sub">Phase '+phase+' — '+phaseNames[phase]+'</div></div></div>';
    }).join('');
  }
  // Exercise matches
  let exHtml='';
  if(q.length>=1){
    const matches=EX_INDEX.filter(e=>e.name.toLowerCase().includes(q)).slice(0,20);
    if(matches.length){
      exHtml='<div class="srch-cat">Exercises</div>'+matches.map(e=>{
        const ico=e.cat==='run'?'🏃':e.cat==='core'?'🌀':e.cat==='rest'?'🧘':'🏋️';
        return '<div class="srch-item" onclick="searchOpenDemo(\''+e.name.replace(/'/g,"\\'")+'\',\''+e.detail.replace(/'/g,"\\'")+'\')">'
          +'<span class="srch-ico">'+ico+'</span>'
          +'<div><div class="srch-name">'+e.name+'</div><div class="srch-sub">'+e.detail+'</div></div></div>';
      }).join('');
    }
  }
  if(!q && !weekHtml){
    res.innerHTML='<div class="srch-hint">Type an exercise name (e.g. "squat", "plank") or a week (e.g. "week 5").</div>';
    return;
  }
  if(!weekHtml && !exHtml){
    res.innerHTML='<div class="srch-hint">No matches for “'+q+'”. Try a different term.</div>';
    return;
  }
  res.innerHTML=weekHtml+exHtml;
}
function searchOpenDemo(name,detail){
  document.getElementById('search-overlay').classList.remove('open');
  showExDemo(name,detail);
}
function gotoWeek(w){
  document.getElementById('search-overlay').classList.remove('open');
  const s=PROGRAM.find(x=>x.week===w);
  if(!s) return;
  showSection('program',null);
  renderProgram(s.phase);
  setTimeout(()=>{
    const first=PROGRAM.find(x=>x.week===w);
    const key=sessionKey(first);
    const row=document.getElementById('prog-'+key);
    const hdr=document.querySelector('[onclick="toggleProgDay(\'prog-'+key+'\')"]');
    if(hdr) hdr.scrollIntoView({behavior:'smooth',block:'center'});
    if(row && !row.classList.contains('open')) toggleProgDay('prog-'+key);
  },120);
}


// ─────────────────────────────────────────
// TREADMILL PACE CALCULATOR (ACSM metabolic equations for grade)
// ─────────────────────────────────────────
const MI_KM = 1.609344;
let pcUnit = 'metric';   // 'metric' | 'imperial'
let pcSpeedKmh = 10;     // canonical belt speed
let pcInited = false;
function pcEnsureInit(){
  if(pcInited) return; pcInited=true;
  pcSyncFields(); pcOutputs();
}
function fmtPaceSec(sec){
  if(!isFinite(sec)||sec<=0) return '–';
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return (s===60? (m+1)+':00' : m+':'+String(s).padStart(2,'0'));
}
function fmtClock(totalSec){
  if(!isFinite(totalSec)||totalSec<=0) return '–';
  totalSec=Math.round(totalSec);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return (h>0? h+':'+String(m).padStart(2,'0') : m+':'+String(s).padStart(2,'0'))
    + (h>0? ':'+String(s).padStart(2,'0') : '');
}
function parsePaceInput(str){
  str=String(str).trim();
  const m=str.match(/^(\d+):([0-5]?\d)$/);
  if(m) return (+m[1])*60+(+m[2]);
  const f=parseFloat(str); return isNaN(f)?null:f*60; // bare number = minutes
}
function pcPerUnitSec(){ // seconds per km (metric) or per mile (imperial) at current speed
  const perKm=3600/pcSpeedKmh;
  return pcUnit==='metric'? perKm : perKm*MI_KM;
}
function pcSyncFields(){
  const sp=document.getElementById('pc-speed'), pa=document.getElementById('pc-pace');
  if(sp) sp.value=(pcUnit==='metric'? pcSpeedKmh : pcSpeedKmh/MI_KM).toFixed(1);
  if(pa) pa.value=fmtPaceSec(pcPerUnitSec());
}
function pcSetUnit(u){
  pcUnit=u; pcInited=true;
  document.getElementById('pc-metric').classList.toggle('active',u==='metric');
  document.getElementById('pc-imperial').classList.toggle('active',u==='imperial');
  const sU=u==='metric'?'km/h':'mph', pU=u==='metric'?'min/km':'min/mi';
  document.getElementById('pc-speed-unit').textContent=sU;
  document.getElementById('pc-pace-unit').textContent=pU;
  document.getElementById('pc-speed-lbl').textContent='Treadmill speed ('+sU+')';
  document.getElementById('pc-pace-lbl').textContent='Pace ('+pU+') — or type a target here';
  pcSyncFields(); pcOutputs();
}
function pcEditSpeed(){
  const v=parseFloat(document.getElementById('pc-speed').value);
  if(isNaN(v)||v<=0) return;
  pcSpeedKmh = pcUnit==='metric'? v : v*MI_KM;
  const pa=document.getElementById('pc-pace'); if(pa) pa.value=fmtPaceSec(pcPerUnitSec());
  pcOutputs();
}
function pcEditPace(){
  const sec=parsePaceInput(document.getElementById('pc-pace').value);
  if(!sec) return;
  const perKmSec = pcUnit==='metric'? sec : sec/MI_KM;
  pcSpeedKmh = 3600/perKmSec;
  const sp=document.getElementById('pc-speed'); if(sp) sp.value=(pcUnit==='metric'? pcSpeedKmh : pcSpeedKmh/MI_KM).toFixed(1);
  pcOutputs();
}
function acsmVO2(kmh, gradePct){           // mL O2 / kg / min
  const S=kmh*1000/60, g=gradePct/100;     // S in m/min
  return kmh>=8 ? (0.2*S + 0.9*S*g + 3.5)  // running eq
               : (0.1*S + 1.8*S*g + 3.5);  // walking eq
}
function pcGapKmh(kmh, gradePct){          // grade-adjusted equivalent flat speed
  if(!gradePct) return kmh;
  const vo2=acsmVO2(kmh,gradePct);
  const Sflat = kmh>=8 ? (vo2-3.5)/0.2 : (vo2-3.5)/0.1; // m/min
  return Math.max(0, Sflat*60/1000);
}
function pcOutputs(){
  const el=document.getElementById('pc-results'); if(!el) return;
  const grade=parseFloat(document.getElementById('pc-incline').value)||0;
  const wt=parseFloat(document.getElementById('pc-weight').value);
  const perKm=3600/pcSpeedKmh, perMi=perKm*MI_KM;
  const gapKmh=pcGapKmh(pcSpeedKmh,grade);
  const gapPerKm = gapKmh>0?3600/gapKmh:0, gapPerMi=gapPerKm*MI_KM;
  const vo2=acsmVO2(pcSpeedKmh,grade);
  const mets=vo2/3.5;
  const dists=[['1 km',1],['1 mile',MI_KM],['5K',5],['10K',10],['Half',21.0975],['Marathon',42.195]];
  const splitRows=dists.map(d=>{
    const t=(d[1]/pcSpeedKmh)*3600;
    return '<div class="pc-line"><span class="k">'+d[0]+'</span><span class="v">'+fmtClock(t)+'</span></div>';
  }).join('');
  let calRows='';
  if(!isNaN(wt)&&wt>0){
    const kcalMin = vo2*wt/1000*5;
    calRows='<div class="pc-line"><span class="k">Energy</span><span class="v">'+Math.round(kcalMin*60)+' kcal/h · '+Math.round(kcalMin*30)+' / 30 min</span></div>';
  }
  el.innerHTML =
    '<div class="pc-res">'
    + '<div class="pc-res-hd">At '+pcSpeedKmh.toFixed(1)+' km/h'+(grade?(' · '+grade+'% incline'):'')+'</div>'
    + '<div class="pc-big">'
    + '<div class="pc-big-card"><div class="pc-big-v">'+fmtPaceSec(perKm)+'</div><div class="pc-big-l">min / km</div></div>'
    + '<div class="pc-big-card"><div class="pc-big-v">'+fmtPaceSec(perMi)+'</div><div class="pc-big-l">min / mile</div></div>'
    + '</div>'
    + (grade? '<div class="pc-line"><span class="k">Effort-equiv. flat pace</span><span class="v">'+fmtPaceSec(gapPerKm)+' /km · '+fmtPaceSec(gapPerMi)+' /mi</span></div>'
            + '<div class="pc-line"><span class="k">Flat-equivalent speed</span><span class="v">'+gapKmh.toFixed(1)+' km/h</span></div>' : '')
    + '<div class="pc-line"><span class="k">Est. VO₂ / intensity</span><span class="v">'+vo2.toFixed(1)+' ml/kg/min · '+mets.toFixed(1)+' METs</span></div>'
    + calRows
    + '<div class="pc-note">Incline maths uses the ACSM walking/running metabolic equations. "Effort-equivalent flat pace" is the flat speed that costs the same oxygen as running this grade.</div>'
    + '</div>'
    + '<div class="pc-res">'
    + '<div class="pc-res-hd">Time on the belt</div>'
    + splitRows
    + '<div class="pc-note">Distances are belt distance at '+pcSpeedKmh.toFixed(1)+' km/h. Tip: type a goal pace in the pace box to get the speed to set the treadmill.</div>'
    + '</div>';
}

window.onload=function(){
  updateCountdown();
  renderToday();
  renderProgram(1);
  // open first today session
  const sessions=getSessionsForDate(new Date());
  if(sessions.length>0){
    setTimeout(()=>{
      const key=sessionKey(sessions[0]);
      toggleSession(key);
    },300);
  }
};
</script>
